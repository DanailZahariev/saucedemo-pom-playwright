name: Playwright Tests
on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install chromium firefox --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Commit and keep alive
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          echo "Last run: $(date)" > keep_alive.txt
          
          git add products.json keep_alive.txt
          
          # Ако няма промени, commit-ът ще гръмне, затова слагаме || exit 0
          git commit -m "Automatic price update and  Keep-Alive" || exit 0
          git push