name: Playwright Tests
on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install chromium firefox --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Commit and keep alive
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "Last run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > keep_alive.txt
          cat keep_alive.txt
          
          git add keep_alive.txt
          git diff --staged --quiet || (git commit -m "chore: keep-alive [skip ci]" && git pull --rebase && git push)